# Unified SemVer policy: Git tags are authoritative; merged PR labels select bump (release:patch|minor|major|none,
# patch by default). Each release attaches the static Linux x64 binaries (musl, run on any distribution) of logwizz and
# logwizz-notify, the systemd units, the example configuration and their SHA-256 to the GitHub release.
name: release
on:
  pull_request:
    types: [closed]
    branches: [main]
permissions:
  contents: read
# One release at a time. A newer merge replaces a merge still waiting in the queue; that is safe because a run
# releases every PR merged since the latest tag. A PR closed without merging gets a group of its own, so it never
# replaces a waiting merge.
concurrency:
  group: ${{ github.event.pull_request.merged && 'release' || format('release-unmerged-{0}', github.run_id) }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check versioning policy
        run: bash .github/scripts/semver-next.test.sh
      - name: Calculate next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git fetch --force origin '+refs/tags/*:refs/tags/*'
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | head -n 1 || true)
          # An earlier queued workflow must never re-release a commit already covered by a newer release.
          if [[ -n "$latest" ]] && git merge-base --is-ancestor "$RELEASE_SHA" "$latest"; then
            echo "Already covered by $latest"
            exit 0
          fi
          # The release runs of earlier merges may have been replaced in the queue, so the bump comes from every PR
          # merged since the latest tag (one label set per PR, ';'-separated), not only from this one.
          # A failed lookup fails the run rather than releasing with a smaller bump.
          set -o pipefail
          sets=$LABELS
          if [[ -n "$latest" ]]; then
            prs=$(git rev-list "$latest..$RELEASE_SHA" | while read -r commit; do
              gh api "repos/$REPO/commits/$commit/pulls" \
                --jq '.[] | select(.merged_at != null and .base.ref == "main") | "\(.number) \([.labels[].name] | join(","))"' || exit 1
            done | sort -u -k1,1n)
            while read -r number labels; do [[ -n $number ]] && sets+=";$labels"; done <<< "$prs"
          fi
          echo "PR label sets: $sets"
          version=$(bash .github/scripts/semver-next.sh "$latest" "$sets" "0.1.0")
          [[ -n "$version" ]] || exit 0
          echo "value=$version" >> "$GITHUB_OUTPUT"

  # Builds without write access: dependency build scripts never see a token that can push.
  build:
    needs: version
    if: needs.version.outputs.value != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl && rustup default stable
      # Only the tests need a musl C compiler (a dev-dependency builds C code); the daemon itself is pure Rust.
      - name: Install musl-tools
        timeout-minutes: 12
        run: bash .github/scripts/apt-install.sh musl-tools
      - name: Stamp version
        env:
          VERSION: ${{ needs.version.outputs.value }}
        # The tag is the source of truth; Cargo.toml's version is stamped only for this build (shown by --version).
        # `cargo update --workspace` rewrites only logwizz's own Cargo.lock entry, so the build below stays --locked.
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml && grep -m1 '^version' Cargo.toml
          cargo update --workspace
      - name: Test and build release
        env:
          # build.rs: report the stamped version exactly, not the git describe of a source build.
          LOGWIZZ_RELEASE: "1"
        run: |
          cargo test --release --locked --target x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Generate per-binary CycloneDX SBOMs
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --format json --describe binaries --spec-version 1.5 --target x86_64-unknown-linux-musl
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          expected = {
              "logwizz": Path("/tmp/logwizz-sbom.cdx.json"),
              "logwizz-notify": Path("/tmp/logwizz-notify-sbom.cdx.json"),
          }
          found = set()
          for path in Path(".").glob("*.json"):
              try:
                  bom = json.loads(path.read_text())
              except (OSError, json.JSONDecodeError):
                  continue
              if not isinstance(bom, dict):
                  continue
              metadata = bom.get("metadata")
              component = metadata.get("component") if isinstance(metadata, dict) else None
              name = component.get("name") if isinstance(component, dict) else None
              if name in expected:
                  shutil.copyfile(path, expected[name])
                  found.add(name)
          missing = set(expected) - found
          if missing:
              raise SystemExit(f"missing CycloneDX SBOM(s) for: {', '.join(sorted(missing))}")
          PY
      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          mkdir dist
          cp target/x86_64-unknown-linux-musl/release/logwizz "dist/logwizz-v$VERSION-linux-x64"
          strip "dist/logwizz-v$VERSION-linux-x64"
          "dist/logwizz-v$VERSION-linux-x64" --version | grep -Fx "logwizz $VERSION"
          cp target/x86_64-unknown-linux-musl/release/logwizz-notify "dist/logwizz-notify-v$VERSION-linux-x64"
          strip "dist/logwizz-notify-v$VERSION-linux-x64"
          "dist/logwizz-notify-v$VERSION-linux-x64" --version | grep -Fx "logwizz-notify $VERSION"
          cp packaging/logwizz.service dist/logwizz.service
          cp packaging/logwizz-notify.service packaging/notify.env.example dist/
          cp config/logwizz.example.toml dist/logwizz.example.toml
          cp /tmp/logwizz-sbom.cdx.json dist/logwizz-sbom.cdx.json
          cp /tmp/logwizz-notify-sbom.cdx.json dist/logwizz-notify-sbom.cdx.json
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: dist, path: dist }
      - name: Attest logwizz build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/logwizz-v${{ needs.version.outputs.value }}-linux-x64
      - name: Attest logwizz SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-path: dist/logwizz-v${{ needs.version.outputs.value }}-linux-x64
          sbom-path: dist/logwizz-sbom.cdx.json
      - name: Attest logwizz-notify build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/logwizz-notify-v${{ needs.version.outputs.value }}-linux-x64
      - name: Attest logwizz-notify SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-path: dist/logwizz-notify-v${{ needs.version.outputs.value }}-linux-x64
          sbom-path: dist/logwizz-notify-sbom.cdx.json
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.value }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Refusing to overwrite existing tag $tag" >&2
            exit 1
          fi
          git tag "$tag" "$RELEASE_SHA"
          git push origin "refs/tags/$tag"
          gh release create "$tag" --verify-tag --generate-notes --title "$tag" dist/*
