name: experimental-portable-compose
on:
  pull_request:
    paths:
      - "packaging/compose/**"
      - ".github/workflows/portable-compose.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate guard policy without privileges
        run: python3 -m unittest discover -s packaging/compose/guard -p test_guard.py
      - name: Validate Compose configuration
        run: docker compose -f packaging/compose/compose.test.yml config --quiet
      - name: Real-container egress enforcement and detection
        run: bash packaging/compose/test-smoke.sh
