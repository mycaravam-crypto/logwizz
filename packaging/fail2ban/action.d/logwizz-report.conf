# Optional Fail2ban ban-action reporting for logwizz-notify.
# Install at /etc/fail2ban/action.d/logwizz-report.conf.
# This reports that the actionban callback ran. Fail2ban invokes subsequent
# actions even when an earlier firewall action fails: this is NOT verification
# that a firewall rule was successfully installed.
#
# The Unix journal socket works with systemd >= 245, unlike
# "systemd-cat --namespace" which needs systemd >= 256.
# Never call fail2ban-client here (it can deadlock inside an actionban).

[Definition]
norestored = 1
actionban = /usr/bin/logger --socket /run/systemd/journal.logwizz/dev-log --priority user.warning --tag logwizz-ban -- "LOGWIZZ_BAN_V1 jail=<name> ip=<ip> bantime=<bantime>"

[Init]
name = logwizz
