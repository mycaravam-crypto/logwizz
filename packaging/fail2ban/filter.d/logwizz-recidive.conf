# Matches Fail2ban's own record of a ban by the "logwizz" jail, for the
# optional logwizz-recidive jail (repeat offenders). Bans by other jails,
# unbans and restored bans after a restart do not match.
[Definition]
failregex = ^\s*fail2ban\.actions\s*\[\d+\]:\s+NOTICE\s+\[logwizz\]\s+Ban\s+<HOST>\s*$
ignoreregex =
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S(?:,%%f)?
